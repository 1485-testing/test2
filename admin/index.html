<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>관리자 | 스마트디자인</title>
  <meta name="robots" content="noindex,nofollow"/>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#1e3a5f;--p2:#2557a0;--p3:#e8f0fb;--a:#e53030;--a2:#c82020;--bg:#f0f4f8;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--sh:0 2px 10px rgba(0,0,0,.08);--sh2:0 8px 28px rgba(0,0,0,.12)}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.hd{background:var(--p);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hd-logo{font-size:17px;font-weight:900;color:#fff;display:flex;align-items:center;gap:10px}
.hd-logo-badge{background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px}
.hd-home{color:rgba(255,255,255,.6);font-size:12.5px;padding:7px 14px;border:1px solid rgba(255,255,255,.15);border-radius:7px;transition:.15s}
.hd-home:hover{background:rgba(255,255,255,.1);color:#fff}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:20px}
.login-wrap{width:100%;max-width:380px}
.login-icon{width:68px;height:68px;background:var(--p3);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;box-shadow:0 4px 16px rgba(30,58,95,.12)}
.login-box{background:var(--card);border-radius:20px;padding:36px 28px 32px;box-shadow:var(--sh2);border:1px solid var(--bd)}
.login-box h2{font-size:21px;font-weight:900;text-align:center;margin-bottom:6px}
.login-box p{font-size:13px;color:var(--mu);text-align:center;margin-bottom:28px;line-height:1.6}
.inp-wrap{position:relative;margin-bottom:14px}
.inp-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.inp{width:100%;padding:13px 14px 13px 42px;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fafafa;color:var(--tx);transition:.15s}
.inp:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(30,58,95,.07)}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#1e3a5f,#2557a0);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 14px rgba(30,58,95,.25);margin-top:4px}
.btn-login:hover{box-shadow:0 6px 20px rgba(30,58,95,.35);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-err{font-size:12.5px;margin-top:12px;padding:11px 14px;border-radius:9px;display:none;font-weight:600;text-align:center}
.login-err.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;display:block}
.login-err.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a;display:block}
#admin-screen{display:none}
.tabs{background:var(--card);border-bottom:2px solid var(--bd);display:flex}
.tab{flex:1;padding:16px 10px;text-align:center;font-size:13px;font-weight:700;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover:not(.on){color:var(--p)}
.tab.on{color:var(--p);border-bottom-color:var(--p)}
.tc{display:none;padding:20px 16px 40px}
.tc.on{display:block}
.form-card{background:var(--card);border-radius:16px;border:1px solid var(--bd);overflow:hidden;box-shadow:var(--sh)}
.form-section{padding:20px}
.form-section+.form-section{border-top:1px solid var(--bd)}
.form-section-title{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);margin-bottom:14px}
.fg{margin-bottom:14px}
.fg:last-child{margin-bottom:0}
.fl{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:6px}
.fi,.fs,.fta{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;font-family:inherit;background:#fafafa;color:var(--tx);outline:none;transition:.15s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(30,58,95,.06)}
.fta{min-height:90px;resize:vertical;line-height:1.7}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-footer{padding:16px 20px;background:#f8fafc;border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.btn-submit{flex:1;padding:13px;background:linear-gradient(135deg,#1e3a5f,#2557a0);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 3px 10px rgba(30,58,95,.2)}
.btn-submit:hover{box-shadow:0 5px 16px rgba(30,58,95,.3);transform:translateY(-1px)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{padding:12px 14px;border-radius:9px;font-size:13px;font-weight:600;display:none;text-align:center;border:1px solid transparent}
.msg.ok{background:#d1fae5;color:#065f46;border-color:#6ee7b7;display:block}
.msg.err{background:#fee2e2;color:#991b1b;border-color:#fecaca;display:block}
.list-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.list-cnt{font-size:13px;color:var(--mu);font-weight:700}
.list-cnt b{color:var(--tx);font-size:15px}
.fsel{padding:8px 11px;border:1.5px solid var(--bd);border-radius:8px;font-size:12.5px;font-family:inherit;background:var(--card);outline:none;color:var(--tx);transition:.15s}
.fsel:focus{border-color:var(--p)}
.case-list{display:grid;gap:10px}
.ci{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh);transition:.15s}
.ci:hover{border-color:#bfcfe4;box-shadow:0 4px 14px rgba(0,0,0,.09)}
.cth{width:60px;height:60px;border-radius:12px;background:var(--p3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px}
.cth img{width:100%;height:100%;object-fit:cover}
.cinfo{flex:1;min-width:0}
.cbadge{display:inline-block;padding:3px 9px;background:var(--p3);color:var(--p2);font-size:10.5px;font-weight:700;border-radius:5px;margin-bottom:5px}
.ctitle{font-size:14px;font-weight:800;color:var(--tx);margin-bottom:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cmeta{font-size:11.5px;color:var(--mu)}
.cact{display:flex;gap:6px;margin-top:9px}
.btn-edit{padding:6px 13px;background:var(--p3);color:var(--p2);border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn-del{padding:6px 13px;background:#fee2e2;color:var(--a2);border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn-edit:hover{background:#d1e0f7;color:var(--p)}
.btn-del:hover{background:#fecaca}
.empty{text-align:center;padding:48px 20px;color:var(--mu);font-size:14px;background:var(--card);border-radius:14px;border:1px dashed var(--bd)}
.modal-bg{position:fixed;inset:0;background:rgba(7,23,46,.5);z-index:999;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:28px 20px;animation:slide-up .28s cubic-bezier(.34,1.2,.64,1)}
@keyframes slide-up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 20px}
.modal h3{font-size:18px;font-weight:900;margin-bottom:20px}
.mbtns{display:flex;gap:10px;margin-top:18px}
.btn-cancel{flex:1;padding:13px;background:var(--bg);color:var(--mu);border:1.5px solid var(--bd);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn-cancel:hover{background:#e8ecf0;color:var(--tx)}
.btn-save{flex:2;padding:13px;background:linear-gradient(135deg,#1e3a5f,#2557a0);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(30,58,95,.2)}
.btn-save:hover{box-shadow:0 5px 16px rgba(30,58,95,.3)}
  </style>
</head>
<body>
<div class="hd">
  <div class="hd-logo">스마트디자인 <span class="hd-logo-badge">ADMIN</span></div>
  <a href="/" class="hd-home">← 사이트로</a>
</div>
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-icon">🔐</div>
    <div class="login-box">
      <h2>관리자 로그인</h2>
      <p>스마트디자인 관리자 전용 페이지입니다.<br>비밀번호를 입력해 주세요.</p>
      <div class="inp-wrap">
        <span class="inp-icon">🔑</span>
        <input type="password" id="pass-inp" class="inp" placeholder="비밀번호 입력" autocomplete="current-password"/>
      </div>
      <button class="btn-login" id="login-btn" onclick="doLogin()">로그인</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>
</div>
<div id="admin-screen">
  <div class="tabs">
    <div class="tab on" data-t="add">➕ 사례 추가</div>
    <div class="tab" data-t="list">📋 사례 관리</div>
  </div>
  <div class="tc on" id="tc-add">
    <div class="form-card">
      <div class="form-section">
        <div class="form-section-title">기본 정보</div>
        <div class="fg"><label class="fl">제목 <span style="color:var(--a)">*</span></label><input type="text" class="fi" id="f-title" placeholder="예: 강동구 천호동 변기교체 완료"/></div>
        <div class="fr">
          <div class="fg"><label class="fl">지역 <span style="color:var(--a)">*</span></label><input type="text" class="fi" id="f-loc" placeholder="예: 강동구 천호동"/></div>
          <div class="fg"><label class="fl">서비스 <span style="color:var(--a)">*</span></label>
            <select class="fs" id="f-svc"><option value="">서비스 선택</option>
              <option>변기교체</option><option>세면대수전교체</option><option>싱크대수전교체</option>
              <option>샤워기수전교체</option><option>환풍기교체</option><option>전체인테리어</option>
              <option>바닥보수</option><option>도배</option><option>타일시공</option><option>누수수리</option>
            </select>
          </div>
        </div>
        <div class="fg"><label class="fl">날짜 <span style="color:var(--a)">*</span></label><input type="date" class="fi" id="f-date"/></div>
      </div>
      <div class="form-section">
        <div class="form-section-title">상세 내용</div>
        <div class="fg"><label class="fl">시공 내용 <span style="color:var(--a)">*</span></label><textarea class="fta" id="f-desc" placeholder="시공 내용을 간략히 입력하세요."></textarea></div>
        <div class="fg"><label class="fl">이미지 URL <span style="color:var(--mu);font-weight:400">(선택)</span></label><input type="url" class="fi" id="f-img" placeholder="https://..."/></div>
        <div class="fg"><label class="fl">태그 <span style="color:var(--mu);font-weight:400">(쉼표 구분)</span></label><input type="text" class="fi" id="f-tags" placeholder="변기교체, 강동구, 당일출장"/></div>
      </div>
      <div class="form-footer">
        <div class="msg" id="submit-msg" style="flex:1;margin:0"></div>
        <button class="btn-submit" id="submit-btn" onclick="submitCase()">📤 게시하기</button>
      </div>
    </div>
  </div>
  <div class="tc" id="tc-list">
    <div class="list-toolbar">
      <div class="list-cnt">총 <b id="list-cnt-num">0</b>개</div>
      <select class="fsel" id="filter-svc" onchange="filterCases()">
        <option value="">전체 서비스</option>
        <option>변기교체</option><option>세면대수전교체</option><option>싱크대수전교체</option>
        <option>샤워기수전교체</option><option>환풍기교체</option><option>전체인테리어</option>
        <option>바닥보수</option><option>도배</option><option>타일시공</option><option>누수수리</option>
      </select>
    </div>
    <div class="case-list" id="case-list"><div class="empty">⏳ 불러오는 중...</div></div>
  </div>
</div>
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>✏️ 사례 수정</h3>
    <input type="hidden" id="e-id"/>
    <div class="fg"><label class="fl">제목</label><input type="text" class="fi" id="e-title"/></div>
    <div class="fr">
      <div class="fg"><label class="fl">지역</label><input type="text" class="fi" id="e-loc"/></div>
      <div class="fg"><label class="fl">서비스</label>
        <select class="fs" id="e-svc">
          <option>변기교체</option><option>세면대수전교체</option><option>싱크대수전교체</option>
          <option>샤워기수전교체</option><option>환풍기교체</option><option>전체인테리어</option>
          <option>바닥보수</option><option>도배</option><option>타일시공</option><option>누수수리</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">날짜</label><input type="date" class="fi" id="e-date"/></div>
    <div class="fg"><label class="fl">시공 내용</label><textarea class="fta" id="e-desc"></textarea></div>
    <div class="fg"><label class="fl">이미지 URL</label><input type="url" class="fi" id="e-img"/></div>
    <div class="fg"><label class="fl">태그 (쉼표 구분)</label><input type="text" class="fi" id="e-tags"/></div>
    <div class="msg" id="edit-msg" style="margin-top:12px"></div>
    <div class="mbtns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEdit()">💾 저장하기</button>
    </div>
  </div>
</div>
<script>
var PASS='',allCases=[];
var ICONS={'변기교체':'🚽','세면대수전교체':'🪣','싱크대수전교체':'🍳','샤워기수전교체':'🚿','환풍기교체':'💨','전체인테리어':'🏠','바닥보수':'🪵','도배':'🖼️','타일시공':'🔲','누수수리':'💧'};
document.getElementById('pass-inp').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function doLogin(){
  var v=document.getElementById('pass-inp').value.trim();
  if(!v)return;
  var btn=document.getElementById('login-btn'),err=document.getElementById('login-err');
  btn.disabled=true;btn.textContent='확인 중...';err.className='login-err';err.style.display='none';
  fetch('/.netlify/functions/add-case',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v,action:'verify'})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,status:r.status,d:d}})})
  .then(function(res){
    if(res.status===200){
      PASS=v;
      document.getElementById('login-screen').style.display='none';
      document.getElementById('admin-screen').style.display='block';
      document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
      loadCases();
    } else if(res.status===401){
      err.className='login-err err';err.textContent='❌ 비밀번호가 올바르지 않습니다.';
    } else {
      err.className='login-err warn';err.textContent='⚠️ 서버 오류: '+(res.d.message||'Netlify 환경변수를 확인해주세요.');
    }
  })
  .catch(function(){err.className='login-err err';err.textContent='❌ 서버 연결 실패. Netlify Function을 확인하세요.';})
  .finally(function(){btn.disabled=false;btn.textContent='로그인'});
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('on')});
    this.classList.add('on');document.getElementById('tc-'+this.dataset.t).classList.add('on');
    if(this.dataset.t==='list')loadCases();
  });
});
function loadCases(){
  fetch('/data/cases.json?t='+Date.now()).then(function(r){return r.json()}).then(function(d){allCases=d;filterCases()})
    .catch(function(){document.getElementById('case-list').innerHTML='<div class="empty">사례를 불러올 수 없습니다.</div>'});
}
function filterCases(){
  var f=document.getElementById('filter-svc').value;
  var list=f?allCases.filter(function(c){return c.service===f}):allCases;
  document.getElementById('list-cnt-num').textContent=list.length;
  var el=document.getElementById('case-list');
  if(!list.length){el.innerHTML='<div class="empty">등록된 사례가 없습니다.</div>';return;}
  el.innerHTML=list.map(function(c){
    var ic=ICONS[c.service]||'🔧';
    var th=c.image?'<div class="cth"><img src="'+c.image+'" alt="" onerror="this.parentNode.innerHTML=\''+ic+'\'"></div>':'<div class="cth">'+ic+'</div>';
    return '<div class="ci">'+th+'<div class="cinfo"><span class="cbadge">'+c.service+'</span><div class="ctitle">'+c.title+'</div><div class="cmeta">📍 '+c.location+' &nbsp;·&nbsp; '+c.date+'</div><div class="cact"><button class="btn-edit" onclick="openEdit(\''+c.id+'\')">✏️ 수정</button><button class="btn-del" onclick="delCase(\''+c.id+'\',\''+c.title.replace(/'/g,'&#39;')+'\')">🗑️ 삭제</button></div></div></div>';
  }).join('');
}
function submitCase(){
  var title=g('f-title'),loc=g('f-loc'),svc=g('f-svc'),date=g('f-date'),desc=g('f-desc'),img=g('f-img'),tags=g('f-tags');
  if(!title||!loc||!svc||!date||!desc){showMsg('submit-msg','err','❗ 필수 항목을 모두 입력해주세요.');return;}
  var btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='⏳ 저장 중...';
  api({password:PASS,title:title,location:loc,service:svc,date:date,description:desc,image:img,tags:tags?tags.split(',').map(function(t){return t.trim()}).filter(Boolean):[]})
  .then(function(res){
    if(res.ok){showMsg('submit-msg','ok','✅ 게시 완료! 잠시 후 사이트에 반영됩니다.');['f-title','f-loc','f-desc','f-img','f-tags'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('f-svc').value='';document.getElementById('f-date').value=new Date().toISOString().slice(0,10);}
    else showMsg('submit-msg','err','❌ 오류: '+(res.d.message||'저장 실패'));
  }).catch(function(){showMsg('submit-msg','err','❌ 네트워크 오류')})
  .finally(function(){btn.disabled=false;btn.textContent='📤 게시하기'});
}
function openEdit(id){
  var c=allCases.find(function(x){return x.id===id});if(!c)return;
  document.getElementById('e-id').value=c.id;document.getElementById('e-title').value=c.title;document.getElementById('e-loc').value=c.location;document.getElementById('e-svc').value=c.service;document.getElementById('e-date').value=c.date;document.getElementById('e-desc').value=c.description;document.getElementById('e-img').value=c.image||'';document.getElementById('e-tags').value=(c.tags||[]).join(', ');
  var msg=document.getElementById('edit-msg');msg.className='msg';msg.style.display='none';
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal(){document.getElementById('edit-modal').classList.remove('open')}
function saveEdit(){
  var id=document.getElementById('e-id').value;
  var title=g('e-title'),loc=g('e-loc'),svc=g('e-svc'),date=g('e-date'),desc=g('e-desc'),img=g('e-img'),tags=g('e-tags');
  if(!title||!loc||!desc){showMsg('edit-msg','err','필수 항목을 입력해주세요.');return;}
  api({password:PASS,action:'update',id:id,title:title,location:loc,service:svc,date:date,description:desc,image:img,tags:tags?tags.split(',').map(function(t){return t.trim()}).filter(Boolean):[]})
  .then(function(res){if(res.ok){showMsg('edit-msg','ok','✅ 수정 완료!');setTimeout(function(){closeModal();loadCases()},1200);}else showMsg('edit-msg','err','❌ '+(res.d.message||'수정 실패'))})
  .catch(function(){showMsg('edit-msg','err','❌ 네트워크 오류')});
}
function delCase(id,title){
  if(!confirm('"'+title+'"\n이 사례를 삭제하시겠습니까?'))return;
  api({password:PASS,action:'delete',id:id}).then(function(res){res.ok?loadCases():alert('삭제 실패: '+(res.d.message||'오류'))}).catch(function(){alert('네트워크 오류')});
}
function g(id){return document.getElementById(id).value.trim()}
function api(body){return fetch('/.netlify/functions/add-case',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){return{ok:r.ok,status:r.status,d:d}})})}
function showMsg(id,type,text){var el=document.getElementById(id);el.className='msg '+type;el.textContent=text;el.style.display='block';if(type==='ok')setTimeout(function(){el.style.display='none'},4000)}
</script>
</body>
</html>
